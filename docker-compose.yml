---
services:
  postgres:
    image: postgres:17
    container_name: prompt-postgres
    environment:
      POSTGRES_DB: PromptDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_started
    entrypoint: |
      sh -c "
        sleep 5 &&
        ollama pull llama3.2
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
  backend:
    build:
      context: ./backend/PromptProcessing
      dockerfile: Dockerfile
    ports:
      - 7267:8080
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=PromptDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
  worker:
    build:
      context: ./backend/PromptProcessing
      dockerfile: Prompt.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=PromptDb;Username=postgres;Password=postgres
      Ollama__BaseUrl: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
  frontend:
    build:
      context: ./frontend
    ports:
      - 5173:5173
    depends_on:
      - backend
volumes:
  postgres_data: null
  ollama: null
